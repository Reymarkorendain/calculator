<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f4f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #252b45 0, transparent 55%),
        #10131c;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 22px;
      border: 1px solid #ffffff14;
      border-radius: 28px;
      background: #1b1f2c;
      box-shadow: 0 24px 70px #0008;
    }

    .heading {
      margin: 2px 4px 20px;
      color: #a7aec2;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .display {
      min-height: 124px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 8px;
      overflow: hidden;
      padding: 10px 4px 22px;
      text-align: right;
    }

    .expression {
      min-height: 22px;
      color: #9299ac;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .result {
      max-width: 100%;
      color: #f7f8fc;
      font-size: clamp(2.4rem, 12vw, 3.5rem);
      font-weight: 350;
      letter-spacing: -0.055em;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-width: 0;
      height: 62px;
      border: 0;
      border-radius: 18px;
      background: #292e3d;
      color: #f1f3f9;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 550;
      transition: background 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #353b4d; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid #aeb8ff; outline-offset: 2px; }
    button.utility { background: #34394a; color: #c4cad9; }
    button.operator { background: #303750; color: #b7c1ff; }
    button.operator:hover { background: #3a456a; }
    button.equals { background: #8798ff; color: #111629; }
    button.equals:hover { background: #a0adff; }
    button.zero { grid-column: span 2; }

    @media (max-width: 380px) {
      .calculator { padding: 17px; }
      .keys { gap: 8px; }
      button { height: 58px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1 class="heading">Calculator</h1>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <output class="result" id="result">0</output>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operator="/" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="*" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="-" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </section>
  </main>
  <script>
    (() => {
      const result = document.querySelector("#result");
      const expression = document.querySelector("#expression");
      let display = "0";
      let storedValue = null;
      let pendingOperator = null;
      let shouldResetDisplay = false;

      const format = (value) => {
        if (!Number.isFinite(value)) return "Error";
        const rounded = Number(value.toPrecision(12));
        return String(Object.is(rounded, -0) ? 0 : rounded);
      };

      const render = () => {
        result.textContent = display;
        result.style.fontSize = display.length > 11 ? "2.4rem" : "";
        expression.textContent = storedValue !== null && pendingOperator
          ? `${format(storedValue)} ${pendingOperator}`
          : "";
      };

      const enterDigit = (digit) => {
        if (display === "Error" || shouldResetDisplay) {
          display = digit;
          shouldResetDisplay = false;
        } else if (display === "0") {
          display = digit;
        } else if (display.replace("-", "").length < 16) {
          display += digit;
        }
        render();
      };

      const calculate = (left, operator, right) => {
        switch (operator) {
          case "+": return left + right;
          case "-": return left - right;
          case "*": return left * right;
          case "/": return right === 0 ? NaN : left / right;
          default: return right;
        }
      };

      const chooseOperator = (operator) => {
        if (display === "Error") return;
        const current = Number(display);
        if (pendingOperator && storedValue !== null && !shouldResetDisplay) {
          storedValue = calculate(storedValue, pendingOperator, current);
          display = format(storedValue);
        } else {
          storedValue = current;
        }
        pendingOperator = operator;
        shouldResetDisplay = true;
        render();
      };

      const equals = () => {
        if (pendingOperator === null || storedValue === null || display === "Error") return;
        const left = storedValue;
        const right = Number(display);
        const answer = calculate(left, pendingOperator, right);
        expression.textContent = `${format(left)} ${pendingOperator} ${format(right)} =`;
        display = format(answer);
        storedValue = null;
        pendingOperator = null;
        shouldResetDisplay = true;
        result.textContent = display;
        result.style.fontSize = display.length > 11 ? "2.4rem" : "";
      };

      const act = (action) => {
        if (action === "clear") {
          display = "0";
          storedValue = null;
          pendingOperator = null;
          shouldResetDisplay = false;
          render();
        } else if (action === "decimal") {
          if (display === "Error" || shouldResetDisplay) {
            display = "0.";
            shouldResetDisplay = false;
          } else if (!display.includes(".")) {
            display += ".";
          }
          render();
        } else if (action === "sign" && display !== "Error" && Number(display) !== 0) {
          display = display.startsWith("-") ? display.slice(1) : `-${display}`;
          render();
        } else if (action === "percent" && display !== "Error") {
          display = format(Number(display) / 100);
          render();
        } else if (action === "backspace" && display !== "Error" && !shouldResetDisplay) {
          display = display.length > 1 ? display.slice(0, -1) : "0";
          if (display === "-") display = "0";
          render();
        } else if (action === "equals") {
          equals();
        }
      };

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
        else if (button.dataset.operator) chooseOperator(button.dataset.operator);
        else if (button.dataset.action) act(button.dataset.action);
      });

      document.addEventListener("keydown", (event) => {
        if (/^\d$/.test(event.key)) enterDigit(event.key);
        else if (event.key === ".") act("decimal");
        else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
        else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          act("equals");
        } else if (event.key === "Backspace") act("backspace");
        else if (event.key === "Escape" || event.key === "Delete") act("clear");
        else if (event.key === "%") act("percent");
      });

      render();
    })();
  </script>
</body>
</html>
